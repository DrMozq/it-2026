<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fbfbf8; color: #1a1a1a; margin: 0; }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { margin-bottom: 4px; }
    p.hint { color: #4a5568; margin-top: 0; }
    form { display: flex; gap: 8px; margin: 24px 0; }
    input { flex: 1; padding: 10px 12px; font-size: 16px; border: 1px solid #d9dde3; border-radius: 8px; }
    button { padding: 10px 16px; font-size: 16px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px; background: #fff; border: 1px solid #d9dde3; border-radius: 8px; margin-bottom: 8px; }
    li.done span.title { text-decoration: line-through; color: #8a94a6; }
    span.title { flex: 1; cursor: pointer; }
    span.time { color: #8a94a6; font-size: 13px; }
    button.del { background: transparent; color: #b42318; padding: 4px 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Список задач</h1>
    <form id="form">
      <input id="title" placeholder="Что нужно сделать?" autocomplete="off">
      <button type="submit">Добавить</button>
    </form>
    <ul id="list"></ul>
  </main>
  <!-- dayjs подключается обычным скриптом из node_modules через маршрут /vendor/dayjs -->
  <script src="/vendor/dayjs/dayjs.min.js"></script>
  <!-- наш код подключён как ES-модуль -->
  <script type="module" src="/main.js"></script>
</body>
</html>
